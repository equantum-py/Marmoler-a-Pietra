name: Build Validation

on:
  push:
      branches:
            - main
                  - feature/**
                pull_request:

                    jobs:
                      build:
                          runs-on: ubuntu-latest

                              steps:
                                    - name: Checkout
                                            uses: actions/checkout@v4
                                                  - name: Setup Node
                                                          uses: actions/setup-node@v4
                                                                  with:
                                                                            node-version: 20
                                                                                  - name: Install dependencies
                                                                                          run: npm install
                                                                                                - name: TypeScript Check
                                                                                                        run: npx tsc --noEmit
                                                                                                              - name: Build
                                                                                                                      run: npm run build
